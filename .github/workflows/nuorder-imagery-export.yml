name: NuOrder Imagery Export

# Job 2 of "Wholesale WIP Nightly". Can also be run by itself from the Actions tab.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nuorder-imagery-export:
    runs-on: ubuntu-latest
    # One at a time - it writes state/imagery-alerts.json.
    concurrency:
      group: nuorder-imagery-export
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NuOrder Imagery Export
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
        run: node scripts/nuorder-imagery-export.js

      # Keeps the "already alerted" list (state/imagery-alerts.json) between runs.
      - name: Commit updated alert state
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/imagery-alerts.json
          git diff --cached --quiet && exit 0
          git commit -m "Update imagery alert state [skip ci]"
          git pull --rebase origin main
          git push
