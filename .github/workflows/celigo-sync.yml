name: Celigo NetSuite Sync

# Last job of "Wholesale WIP Nightly". Can also be run by itself from the Actions tab.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  celigo-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Celigo NetSuite Sync
        env:
          CELIGO_API_TOKEN: ${{ secrets.CELIGO_API_TOKEN }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
        run: node scripts/celigo-sync.js
