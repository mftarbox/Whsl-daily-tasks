name: Dropped Rework Alert

# Job 3 of "Wholesale WIP Nightly". Can also be run by itself from the Actions tab.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dropped-alert:
    runs-on: ubuntu-latest
    # Never two copies at once (e.g. a manual run while the nightly one is going) - they would
    # both write state/ and could double-post.
    concurrency:
      group: dropped-rework-alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Dropped Rework Alert
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          NETSUITE_ACCOUNT_ID: ${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY: ${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET: ${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID: ${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET: ${{ secrets.NETSUITE_TOKEN_SECRET }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node scripts/dropped-alert.js

      # Runs even if the script failed partway, so whatever it DID record is kept.
      - name: Commit updated state files
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update processed-order state [skip ci]"
          git pull --rebase origin main
          git push
